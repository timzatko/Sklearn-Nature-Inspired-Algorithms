name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
    - name: Lint
      run: |
        flake8 ./tests ./sklearn_nature_inspired_algorithms
    - name: Tests
      run: |
        coverage run --source=./sklearn_nature_inspired_algorithms -m unittest tests
        coverage report
    - name: Build
      run: |
        python -m build
    - uses: actions/upload-artifact@v4
      if: ${{ matrix.python-version == '3.12' }}
      with:
        name: dist
        path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist
    - name: Prepare Release
      run: |
        echo "LIB_WHL_PATH=$(find dist -type f -name '*.whl')" >> $GITHUB_ENV
        echo "LIB_WHL_NAME=$(find dist -type f -name '*.whl' -exec basename {} \;)" >> $GITHUB_ENV
        echo "LIB_TAR_GZ_PATH=$(find dist -type f -name '*.tar.gz')" >> $GITHUB_ENV
        echo "LIB_TAR_GZ_NAME=$(find dist -type f -name '*.tar.gz' -exec basename {} \;)" >> $GITHUB_ENV
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: true
        prerelease: false
    - name: Upload Release Asset (.tar.gz)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.LIB_TAR_GZ_PATH }}
        asset_name: ${{ env.LIB_TAR_GZ_NAME }}
        asset_content_type: application/gzip
    - name: Upload Release Asset (.whl)
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.LIB_WHL_PATH }}
        asset_name: ${{ env.LIB_WHL_NAME }}
        asset_content_type: application/gzip
